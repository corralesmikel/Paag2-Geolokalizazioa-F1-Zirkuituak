<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="icon" href="img/favicon.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar">
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="map.html">Mapa</a></li>
        </ul>
    </nav>

    <main class="map-layout-container">
        <h1>Mapa de Circuitos F1 2025</h1>
        <div class="map-layout">

            <!-- Panel lateral -->
            <aside class="map-filters">
                <h3>Filtros</h3>

                <label>
                    <input type="checkbox" id="toggleCircuits" checked>
                    Circuitos
                </label>

                <label>
                    <input type="checkbox" id="toggleHotels" checked>
                    Hoteles
                </label>

                <label>
                    <input type="checkbox" id="toggleRestaurants" checked>
                    Restaurantes
                </label>
            </aside>

            <!-- Mapa -->
            <div id="map"></div>
        </div>
    </main>
</body>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/config.js"></script>
<script type="module" src="js/map.js"></script> <!-- Es type="module" porque hay datos compartidos -->

</html>
